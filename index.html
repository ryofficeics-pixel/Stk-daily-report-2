// ---- Large-blob offload (IndexedDB) --------------------------------------
// Photos and PDF attachments are stored as base64 data: URLs inline in the
// app's data model. localStorage has a hard per-origin quota (typically
// 5-10MB) shared by the WHOLE app - a single day with a few dozen photos can
// exceed it on its own. When that happens, localStorage.setItem() throws and
// the ENTIRE save silently fails (previous code just logged a console
// warning), so photos that were visibly added and even used to export a PDF
// in the current session vanish on the next reload because they were never
// actually persisted.
//
// Fix: keep the in-memory `db` object exactly as before (nothing else in the
// app changes), but before writing to localStorage, swap every large data:
// URL out for a short "idb:<key>" reference and stash the real bytes in
// IndexedDB instead, which has a vastly larger quota. On load, references are
// hydrated back into real data: URLs before the rest of the app ever sees

function deleteProject(projectId){const p=getProjectById(projectId);if(!p)return;if(!confirm(`Delete data proyek "${p.name}" beserta Daily/Weekly terkait?`))return;db.projects=db.projects.filter(x=>x.id!==projectId);db.dailyReports=db.dailyReports.filter(x=>x.projectId!==projectId);db.weeklyReports=db.weeklyReports.filter(x=>x.projectId!==projectId);db.progressReports=(db.progressReports||[]).filter(x=>x.projectId!==projectId);db.beritaAcara=(db.beritaAcara||[]).filter(x=>x.projectId!==projectId);db.surveys.forEach(s=>{if(s.linkedProjectId===projectId){s.status="survey_only";s.linkedProjectId=null;s.linkedDailyReportId=null}});if(activeProjectId===projectId)activeProjectId=db.projects[0]?.id||"";save();route="projects";render()}

function baSignaturePartyHtml(r,party){return `<div class="sig-party"><div class="field"><label>${esc(party.label)} - Nama</label><input class="input" name="${party.namaField}" value="${esc(r[party.namaField]||"")}"></div><div class="field"><label>${esc(party.label)} - Jabatan</label><input class="input" name="${party.jabatanField}" value="${esc(r[party.jabatanField]||"")}"></div>${baSignaturePadBlock(r,party)}</div>`}
function baSignaturePadBlock(r,party){const hasSaved=!!r[party.imgField];const editing=sigEditingParties.has(party.key)||!hasSaved;const canvasId=`sigCanvas-${party.key}`;return editing?`<div class="sig-block"><label class="sig-label">Tanda Tangan</label><canvas class="sig-canvas" id="${canvasId}" data-sig-party="${party.key}"></canvas><div class="sig-actions"><button class="btn small" type="button" onclick="clearSignaturePad('${party.key}')">Hapus</button><button class="btn small primary" type="button" onclick="saveSignaturePad('${party.key}')">Simpan Tanda Tangan</button></div></div>`:`<div class="sig-block"><label class="sig-label">Tanda Tangan</label><div class="sig-preview"><img src="${r[party.imgField]}" alt="Tanda tangan ${esc(party.label)}"></div><div class="sig-actions"><button class="btn small" type="button" onclick="editSignaturePad('${party.key}')">Ganti Tanda Tangan</button></div></div>`}
function initSignaturePad(canvasId,partyKey){const canvas=document.getElementById(canvasId);if(!canvas||canvas.dataset.sigBound)return;canvas.dataset.sigBound="1";const ratio=window.devicePixelRatio||1;const rect=canvas.getBoundingClientRect();canvas.width=Math.max(1,Math.round(rect.width*ratio));canvas.height=Math.max(1,Math.round(rect.height*ratio));const ctx=canvas.getContext("2d");ctx.scale(ratio,ratio);ctx.lineWidth=2.4;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#171717";canvas.style.touchAction="none";const draft=sigDraftCache[partyKey];if(draft){const img=new Image();img.onload=()=>ctx.drawImage(img,0,0,rect.width,rect.height);img.src=draft;canvas.dataset.hasInk="1"}let drawing=false,lastX=0,lastY=0;const pos=e=>{const rc=canvas.getBoundingClientRect();return{x:e.clientX-rc.left,y:e.clientY-rc.top}};const start=e=>{drawing=true;const pt=pos(e);lastX=pt.x;lastY=pt.y;canvas.dataset.hasInk="1";e.preventDefault()};const move=e=>{if(!drawing)return;const pt=pos(e);ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(pt.x,pt.y);ctx.stroke();lastX=pt.x;lastY=pt.y;e.preventDefault()};const finish=()=>{if(!drawing)return;drawing=false;try{sigDraftCache[partyKey]=canvas.toDataURL("image/png")}catch(e){}};canvas.addEventListener("pointerdown",start);canvas.addEventListener("pointermove",move);canvas.addEventListener("pointerup",finish);canvas.addEventListener("pointerleave",finish);canvas.addEventListener("pointercancel",finish)}
function initAllSignaturePads(){SIG_PARTIES.forEach(party=>initSignaturePad(`sigCanvas-${party.key}`,party.key))}
function clearSignaturePad(partyKey){const canvas=document.getElementById(`sigCanvas-${partyKey}`);if(canvas){const ctx=canvas.getContext("2d");ctx.clearRect(0,0,canvas.width,canvas.height);canvas.dataset.hasInk=""}delete sigDraftCache[partyKey]}
function editSignaturePad(partyKey){sigEditingParties.add(partyKey);render()}
function saveSignaturePad(partyKey){const canvas=document.getElementById(`sigCanvas-${partyKey}`);if(!canvas||canvas.dataset.hasInk!=="1"){alert("Silakan tanda tangan terlebih dahulu di area yang tersedia.");return}const party=SIG_PARTIES.find(x=>x.key===partyKey);if(!party)return;const r=ensureBeritaAcaraDraft();if(!r)return;captureLiveBeritaAcaraFields(r);r[party.imgField]=canvas.toDataURL("image/png");delete sigDraftCache[partyKey];sigEditingParties.delete(partyKey);save();render()}
function baFormHtml(r,p){return `<form class="form" id="beritaAcaraForm"><input type="hidden" name="id" value="${esc(r.id)}"><div class="field full"><label>Proyek</label><input class="input" value="${esc(p?.name||"Pilih proyek dari menu Proyek")}" disabled></div><div class="field"><label>Klien / Owner</label><input class="input" value="${esc(p?.owner||"-")}" disabled></div><div class="field"><label>Lokasi</label><input class="input" value="${esc(p?.location||"-")}" disabled></div><div class="field"><label>Nomor Proyek</label><input class="input" value="${esc(p?.projectNumber||"-")}" disabled></div><div class="field"><label>PIC</label><input class="input" value="${esc(p?.estimator||"-")}" disabled></div><div class="field"><label>Tim</label><input class="input" value="${esc(p?.team||"Tim STK")}" disabled></div><div class="field"><label>Tanggal</label><input class="input" type="date" name="tanggal" required value="${esc(r.tanggal||today())}"></div><div class="field"><label>Nomor Berita Acara</label><input class="input" name="nomorBA" placeholder="Auto saat disimpan, mis. BA-0001" value="${esc(r.nomorBA||"")}"></div><div class="field"><label>Kontraktor</label><input class="input" name="kontraktor" value="${esc(r.kontraktor||"PT. Solusi Teknologi Konstruksi")}"></div><div class="field"><label>Konsultan</label><input class="input" name="konsultan" value="${esc(r.konsultan||"")}"></div><div class="field"><label>Nomor Kontrak (opsional)</label><input class="input" name="nomorKontrak" value="${esc(r.nomorKontrak||"")}"></div><div class="field"><label>Jenis Pekerjaan</label><select class="select" name="jenisPekerjaan"><option value="">Pilih jenis pekerjaan</option>${BA_JENIS_PEKERJAAN_OPTIONS.map(j=>`<option value="${j}" ${r.jenisPekerjaan===j?"selected":""}>${j}</option>`).join("")}</select></div><div class="field"><label>Status Pekerjaan</label><select class="select" name="statusPekerjaan">${BA_STATUS_OPTIONS.map(s=>`<option value="${s}" ${(r.statusPekerjaan||"Dalam Proses")===s?"selected":""}>${s}</option>`).join("")}</select></div><div class="field full"><label>Uraian Pekerjaan</label><textarea class="textarea" name="uraianPekerjaan" required>${esc(r.uraianPekerjaan||"")}</textarea></div><div class="field full"><label>Dasar Pelaksanaan</label><textarea class="textarea" name="dasarPelaksanaan" placeholder="mis. RAB, gambar kerja, instruksi kerja, SPK">${esc(r.dasarPelaksanaan||"")}</textarea></div><div class="field full">${baChecklistEditor(r)}</div><div class="field full"><label>Hasil Pemeriksaan</label><textarea class="textarea" name="hasilPemeriksaan">${esc(r.hasilPemeriksaan||"")}</textarea></div><div class="field full"><label>Catatan Tambahan</label><textarea class="textarea" name="catatan">${esc(r.catatan||"")}</textarea></div><div class="field full"><label>Kesimpulan</label><textarea class="textarea" name="kesimpulan">${esc(r.kesimpulan||"")}</textarea></div><div class="field full"><label>Tambah foto lampiran (langsung diupload begitu dipilih)</label><input class="input" type="file" name="photos" accept="image/*" multiple onchange="handlePhotoSelect(this,'beritaAcara')"></div><div class="field full">${baPhotoEditor(r)}</div><div class="subsection"><div class="subhead"><label>Tanda Tangan</label></div><div class="sig-parties">${SIG_PARTIES.map(party=>baSignaturePartyHtml(r,party)).join("")}</div></div><div class="field full"><button class="btn primary" type="submit" ${p?"":"disabled"}>Simpan Berita Acara</button></div></form>`}
function baDashboardStats(){const all=db.beritaAcara||[];const byStatus={};all.forEach(x=>{byStatus[x.statusPekerjaan]=(byStatus[x.statusPekerjaan]||0)+1});return{total:all.length,byStatus}}
function beritaAcaraFilteredList(){let items=[...(db.beritaAcara||[])];if(baFilterStatus)items=items.filter(x=>x.statusPekerjaan===baFilterStatus);if(baSearchQuery.trim()){const q=normalizeText(baSearchQuery);items=items.filter(x=>{const p=getProjectById(x.projectId);return normalizeText(x.nomorBA).includes(q)||normalizeText(x.uraianPekerjaan).includes(q)||normalizeText(x.jenisPekerjaan).includes(q)||normalizeText(p?.name).includes(q)})}items.sort((a,b)=>(b.tanggal||"").localeCompare(a.tanggal||""));return items}
function viewBeritaAcara(){const p=getProjectById(activeProjectId);const r=editingBeritaAcaraId?getBeritaAcaraById(editingBeritaAcaraId):blankBeritaAcara();const stats=baDashboardStats();const items=beritaAcaraFilteredList();return `<section><div class="toolbar"><div class="title"><h1>Berita Acara Pekerjaan</h1><p>Dokumen serah terima / pemeriksaan pekerjaan yang berlaku untuk semua jenis pekerjaan (sipil, arsitektur, interior, MEP, renovasi, finishing, landscape, maintenance, dll). Data proyek memakai database proyek yang sama dengan Daily/Weekly/Laporan Progress.</p></div><div class="actions"><button class="btn" data-go="daily">Kembali</button><button class="btn" onclick="editingBeritaAcaraId='';resetSignatureEditingState();render()">Berita Acara Baru</button></div></div><div class="snapshot" style="grid-template-columns:repeat(4,1fr);margin-bottom:14px"><div class="snap"><small>Total Berita Acara</small><strong>${stats.total}</strong></div><div class="snap"><small>Disetujui</small><strong>${stats.byStatus["Disetujui"]||0}</strong></div><div class="snap"><small>Dalam Proses</small><strong>${stats.byStatus["Dalam Proses"]||0}</strong></div><div class="snap"><small>Selesai</small><strong>${stats.byStatus["Selesai"]||0}</strong></div></div><div class="grid"><div class="card pad span5">${p?"":`<p class="muted">Pilih proyek terlebih dahulu dari menu Proyek sebelum membuat Berita Acara.</p>`}${baFormHtml(r,p)}</div><div class="card pad span7"><h2 style="margin-top:0">Daftar Berita Acara</h2><div class="form" style="grid-template-columns:2fr 1fr;margin-bottom:12px"><div class="field"><label>Cari</label><input class="input" value="${esc(baSearchQuery)}" oninput="baSearchQuery=this.value;render()" placeholder="Cari nomor, uraian, jenis, atau nama proyek"></div><div class="field"><label>Filter Status</label><select class="select" onchange="baFilterStatus=this.value;render()"><option value="">Semua Status</option>${BA_STATUS_OPTIONS.map(s=>`<option value="${s}" ${baFilterStatus===s?"selected":""}>${s}</option>`).join("")}</select></div></div><div class="list">${items.map(x=>{const xp=getProjectById(x.projectId);return `<article class="row"><div><h3>${esc(x.nomorBA||"Belum bernomor")} <span class="chip ${x.statusPekerjaan==="Disetujui"?"ok":""}">${esc(x.statusPekerjaan||"-")}</span></h3><p>${esc(xp?.name||"-")} - ${fmtDate(x.tanggal)} - ${esc(trim(x.uraianPekerjaan||"-",90))}</p><div class="meta"><span class="chip">${photosOf(x).length} foto</span><span class="chip">${esc(x.jenisPekerjaan||"Jenis belum diisi")}</span></div></div><div class="actions"><button class="btn small primary" onclick="openBeritaAcara('${x.id}')">Preview</button><button class="btn small" onclick="editBeritaAcara('${x.id}')">Edit</button><button class="btn small" onclick="duplicateBeritaAcara('${x.id}')">Duplicate</button><button class="btn small warn" onclick="deleteBeritaAcara('${x.id}')">Hapus</button></div></article>`}).join("")||`<div class="empty"><h3>Belum ada Berita Acara</h3><p>Buat Berita Acara baru dari form di samping. Pilih proyek dari menu Proyek terlebih dahulu.</p></div>`}</div></div></div></section>`}
async function saveBeritaAcara(fd){const projectId=activeProjectId;if(!getProjectById(projectId)){alert("Berita Acara wajib memilih existing project.");return}const id=fd.get("id")||editingBeritaAcaraId||uid("ba");let r=getBeritaAcaraById(id);const tanggal=fd.get("tanggal")||today();const nowIso=new Date().toISOString();const currentPhotos=photosOf(r);capturePhotoCaptions(currentPhotos);if(hasUploadingPhotos(currentPhotos)){alert("Masih ada foto yang sedang diupload. Tunggu sebentar lalu simpan lagi.");return}const currentChecklist=checklistOf(r);captureBAChecklistRows(currentChecklist);const uraianPekerjaan=String(fd.get("uraianPekerjaan")||"").trim();if(!uraianPekerjaan){alert("Uraian Pekerjaan wajib diisi.");return}const nomorBA=String(fd.get("nomorBA")||r?.nomorBA||"").trim()||generateBANumber(id);const data={id,projectId,tanggal,nomorBA,kontraktor:fd.get("kontraktor")||"PT. Solusi Teknologi Konstruksi",konsultan:fd.get("konsultan")||"",nomorKontrak:fd.get("nomorKontrak")||"",jenisPekerjaan:fd.get("jenisPekerjaan")||"",uraianPekerjaan,dasarPelaksanaan:fd.get("dasarPelaksanaan")||"",catatan:fd.get("catatan")||"",hasilPemeriksaan:fd.get("hasilPemeriksaan")||"",kesimpulan:fd.get("kesimpulan")||"",statusPekerjaan:fd.get("statusPekerjaan")||"Dalam Proses",checklist:currentChecklist.filter(x=>String(x.item||"").trim()).map(x=>({...x,item:String(x.item).trim(),status:x.status||"Ya",catatan:(x.catatan||"").trim()})),photos:currentPhotos.map((ph,i)=>({...ph,number:i+1})),sigPihakPertamaNama:fd.get("sigPihakPertamaNama")||"",sigPihakPertamaJabatan:fd.get("sigPihakPertamaJabatan")||"",sigPihakKeduaNama:fd.get("sigPihakKeduaNama")||"",sigPihakKeduaJabatan:fd.get("sigPihakKeduaJabatan")||"",sigMengetahuiNama:fd.get("sigMengetahuiNama")||"",sigMengetahuiJabatan:fd.get("sigMengetahuiJabatan")||"",sigPihakPertamaImg:r?.sigPihakPertamaImg||"",sigPihakKeduaImg:r?.sigPihakKeduaImg||"",sigMengetahuiImg:r?.sigMengetahuiImg||"",createdAt:r?.createdAt||nowIso,updatedAt:nowIso};if(r)Object.assign(r,data);else db.beritaAcara.push(data);editingBeritaAcaraId=id;save();render()}
function editBeritaAcara(id){const r=getBeritaAcaraById(id);if(!r)return;resetSignatureEditingState();activeProjectId=r.projectId;editingBeritaAcaraId=id;route="beritaAcara";render()}
async function openBeritaAcara(id){const r=getBeritaAcaraById(id);if(!r)return;await ensurePhotoOrientations(r);activeProjectId=r.projectId;previewBeritaAcaraId=id;route="beritaAcaraPreview";render()}
function deleteBeritaAcara(id){if(!confirm("Hapus Berita Acara ini?"))return;db.beritaAcara=db.beritaAcara.filter(x=>x.id!==id);if(editingBeritaAcaraId===id)editingBeritaAcaraId="";if(previewBeritaAcaraId===id)previewBeritaAcaraId="";save();render()}
function duplicateBeritaAcara(id){const src=getBeritaAcaraById(id);if(!src)return;const newId=uid("ba");const copy={...src,id:newId,nomorBA:generateBANumber(newId),tanggal:today(),checklist:checklistOf(src).map(x=>({...x,id:uid("bac")})),photos:photosOf(src).map(ph=>({...ph,id:uid("photo")})),createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};db.beritaAcara.push(copy);editingBeritaAcaraId=newId;activeProjectId=copy.projectId;route="beritaAcara";save();render()}

function beritaAcaraPdfPagesDetailed(r,p){const photos=photosOf(r),groups=groupPhotosForPdf(photos);const cover=reportCoverPage("Berita Acara","Berita Acara Pekerjaan",p,[{label:"Nomor Berita Acara",value:r.nomorBA},{label:"Tanggal",value:fmtDate(r.tanggal)},{label:"Lokasi",value:p?.location||"-"},{label:"Klien / Owner",value:p?.owner||"-"},{label:"Jenis Pekerjaan",value:r.jenisPekerjaan||"-"},{label:"Status Pekerjaan",value:r.statusPekerjaan},{label:"Kontraktor",value:r.kontraktor},{label:"Konsultan",value:r.konsultan||"-"},{label:"Nomor Kontrak",value:r.nomorKontrak||"-"}],r.tanggal);return `${cover}<section class="paper" id="beritaAcaraDetailPage">${headerHtml(p?.name,r.tanggal)}<div id="beritaAcaraDetailHead"><h2>Detail Berita Acara Pekerjaan</h2>${section("Uraian Pekerjaan",r.uraianPekerjaan)}${section("Dasar Pelaksanaan",r.dasarPelaksanaan)}${section("Hasil Pemeriksaan",r.hasilPemeriksaan)}${section("Catatan Tambahan",r.catatan)}${section("Kesimpulan",r.kesimpulan)}</div>${baChecklistTableHtml(r)}${footerHtml(p?.name,r.tanggal)}</section>${groups.map((g,i)=>photoReportPage("Lampiran Foto",p?.name||"-",fmtDate(r.tanggal),g.items,null,i+1,groups.length,g.orientation)).join("")}<section class="paper">${headerHtml(p?.name,r.tanggal)}<div class="kicker">TTD</div>${baSignatureHtml(r)}${footerHtml(p?.name,r.tanggal)}</section>`}

function baCompactRef(r){const blank=(val,cls)=>val?`<span class="ba-fill">${esc(val)}</span>`:`<span class="ba-blank ${cls||""}"></span>`;return `<div class="ba-ref"><span>Nomor BA : ${blank(r.nomorBA)}</span><span>Tanggal : ${blank(r.tanggal?fmtDate(r.tanggal):"","small")}</span><span>Status : <span class="ba-fill">${esc(r.statusPekerjaan)}</span></span></div>`}

function materialEditor(r){const items=materialsOf(r);return `<div class="subsection" id="materialSubsection"><div class="subhead"><label>Material Masuk Hari Ini</label></div><div class="item-table">${items.length?`<div class="item-row item-row-head"><span>Material</span><span>Qty</span><span>Satuan</span><span>Supplier</span><span>Keterangan</span><span></span></div>${items.map(m=>`<div class="item-row"><input class="input small" data-material-id="${m.id}" data-material-field="name" placeholder="Nama material" value="${esc(m.name||"")}" enterkeyhint="next" onkeydown="handleItemFieldKey(event,this)" onfocus="this.select()"><input class="input small" data-material-id="${m.id}" data-material-field="qty" type="number" step="any" inputmode="decimal" placeholder="Qty" value="${esc(m.qty??"")}" enterkeyhint="next" onkeydown="handleItemFieldKey(event,this)" onfocus="this.select()"><input class="input small" data-material-id="${m.id}" data-material-field="unit" placeholder="Satuan" value="${esc(m.unit||"")}" enterkeyhint="next" onkeydown="handleItemFieldKey(event,this)" onfocus="this.select()"><input class="input small" data-material-id="${m.id}" data-material-field="supplier" placeholder="Supplier" value="${esc(m.supplier||"")}" enterkeyhint="next" onkeydown="handleItemFieldKey(event,this)" onfocus="this.select()"><input class="input small" data-material-id="${m.id}" data-material-field="note" placeholder="Keterangan" value="${esc(m.note||"")}" enterkeyhint="done" onkeydown="handleItemFieldKey(event,this)" onfocus="this.select()"><button class="btn small warn" type="button" onclick="removeMaterial('${m.id}')">Hapus</button></div>`).join("")}`:`<p class="muted">Belum ada material masuk hari ini.</p>`}</div><div class="item-add-row" style="margin-top:8px"><button class="btn small" type="button" onclick="addMaterialRow()">+ Tambah Material</button></div><div class="bulk-input-box"><label>Input Cepat Material (tempel teks, lalu proses)</label><textarea class="textarea" id="bul function equipmentEditor(r){const items=equipmentsOf(r),statuses=["Milik Sendiri","Sewa","Subkon"];return `<div class="subsection" id="equipmentSubsection"><div class="subhead"><label>Peralatan Digunakan Hari Ini</label></div><div class="item-table">${items.length?`<div class="item-row item-row-head"><span>Peralatan</span><span>Qty</span><span>Satuan</span><span>Status</span><span>Keterangan</span><span></span></div>${items.map(e=>`<div class="item-row"><input class="input small" data-equipment-id="${e.id}" data-equipment-field="name" placeholder="Nama peralatan" value="${esc(e.name||"")}" enterkeyhint="next" onkeydown="handleItemFieldKey(event,this)" onfocus="this.select()"><input class="input small" data-equipment-id="${e.id}" data-equipment-field="qty" type="number" step="any" inputmode="decimal" placeholder="Qty" value="${esc(e.qty??"")}" enterkeyhint="next" onkeydown="handleItemFieldKey(event,this)" onfocus="this.select()"><input class="input small" data-equipment-id="${e.id}" data-equipment-field="unit" placeholder="Satuan" value="${esc(e.unit||"")}" enterkeyhint="next" onkeydown="handleItemFieldKey(event,this)" onfocus="this.select()"><select class="select small" data-equipment-id="${e.id}" data-equipment-field="status" onkeydown="handleItemFieldKey(event,this)">${statuses.map(s=>`<option value="${s}" ${e.status===s?"selected":""}>${s}</option>`).join("")}</select><input class="input small" data-equipment-id="${e.id}" data-equipment-field="note" placeholder="Keterangan" value="${esc(e.note||"")}" enterkeyhint="done" onkeydown="handleItemFieldKey(event,this)" onfocus="this.select()"><button class="btn small warn" type="button" onclick="removeEquipment('${e.id}')">Hapus</button></div>`).join("")}`:`<p class="muted">Belum ada peralatan digunakan hari ini.</p>`}</div><div class="item-add-row" style="margin-top:8px"><button class="btn small" type="button" onclick="addEquipmentRow()">+ Tambah Peralatan</button></div><div class="bulk-input-box"><label>Input Cepat Pe const WEATHER_PERIODS=[{key:"pagi",label:"Pagi"},{key:"siang",label:"Siang"},{key:"sore",label:"Sore"},{key:"malam",label:"Malam"}];
const WEATHER_OPTIONS=["Cerah","Berawan","Mendung","Hujan Ringan","Hujan Sedang","Hujan Deras","Berkabut","Angin Kencang"];
function ensureWeatherSlots(r){if(!r)return[];r.documentationMeta=r.documentationMeta||{};const existing=Array.isArray(r.documentationMeta.weatherEntries)?r.documentationMeta.weatherEntries:[];
  // One report can now span several calendar days (date..dateEnd), and weather is tracked per day,
  // not per report - so the slot list is every day in range x the 4 fixed periods. Existing entries
  // are matched back by (date,label) so edits survive re-renders and range changes; legacy entries
  // saved before dateEnd existed have no .date, so those are treated as belonging to the report's
  // single date (matches their original meaning exactly - no data is reinterpreted).
  const days=dateRangeList(r.date,r.dateEnd);
  const byKey=new Map();
  existing.forEach(w=>{const wd=w.date||r.date;byKey.set(`${wd}|${String(w.label||"").trim().toLowerCase()}`,w)});
  const slots=[];
  days.forEach(day=>{WEATHER_PERIODS.forEach(p=>{const found=byKey.get(`${day}|${p.label.toLowerCase()}`);slots.push({id:found?.id||uid("wthr"),date:day,label:p.label,condition:found?.condition||""})})});
  r.documentationMeta.weatherEntries=slots;return slots}
function weatherEditor(r){const items=ensureWeatherSlots(r);const byDay=new Map();items.forEach(w=>{if(!byDay.has(w.date))byDay.set(w.date,[]);byDay.get(w.date).push(w)});const days=[...byDay.keys()];const multi=days.length>1;return `<div class="subsection" id="weatherSubsection"><div class="subhead"><label>Cuaca${multi?` per hari (${days.length} hari)`:" (Pagi / Siang / Sore / Malam)"}</label></div>${days.map(day=>`${multi?`<p class="weather-day-label">${esc(fmtDate(day))}</p>`:""}${byDay.get(day).map(w=>`<div class="weather-row"><span class="weather-period-label">${esc(w.label)}</span><select class="select small" data-weather-id="${w.id}" data-weather-date="${esc(w.date)}" data-weather-period="${esc(w.label)}" data-weather-field="condition" onkeydown="handleWeatherSelectKey(event)"><option value="" ${w.condition?"":"selected"}>Pilih Cuaca</option>${WEATHER_OPTIONS.map(o=>`<option value="${o}" ${w.condition===o?"selected":""}>${o}</option>`).join("")}</select></div>`).join("")}`).join("")}</div>`}
function handleWeatherSelectKey(e){if(e.key!=="Enter")return;e.preventDefault();const selects=$$('#weatherSubsection select[data-weather-field="condition"]');const idx=selects.indexOf(e.target);if(idx>-1&&idx<selects.length-1)selects[idx+1].focus()}
const ITEM_FIELD_ORDER={material:["name","qty","unit","supplier","note"],equipment:["name","qty","unit","status","note"]};
const ITEM_ADD_FN={material:()=>addMaterialRow(),equipment:()=>addEquipmentRow()};
function handleItemFieldKey(e,el){if(e.key!=="Enter")return;e.preventDefault();let kind=null,field=null;if(el.dataset.materialField!==undefined){kind="material";field=el.dataset.materialField}else if(el.dataset.equipmentField!==undefined){kind="equipment";field=el.dataset.equipmentField}if(!kind)return;const order=ITEM_FIELD_ORDER[kind];const idx=order.indexOf(field);const row=el.closest(".item-row");if(row&&idx>-1&&idx<order.length-1){const nextEl=row.querySelector(`[data-${kind}-field="${order[idx+1]}"]`);if(nextEl){nextEl.focus();if(typeof nextEl.select==="function")nextEl.select();return}}const fn=ITEM_ADD_FN[kind];if(fn)fn()}
function captureWeatherRows(list){$$("[data-weather-field]").forEach(el=>{let row;if(el.dataset.weatherDate!==undefined){row=list.find(w=>w.date===el.dataset.weatherDate&&w.label===el.dataset.weatherPeriod)}else if(el.dataset.weatherPeriod!==undefined){row=list.find(w=>w.label===el.dataset.weatherPeriod)}else{row=list.find(w=>w.id===el.dataset.weatherId)}if(row)row[el.dataset.weatherField]=el.value})}
function refreshWeatherSubsection(){const r=ensureDailyDraft();if(!r)return;captureLiveDailyFields(r);const dEl=document.querySelector('#dailyForm [name="date"]'),eEl=document.querySelector('#dailyForm [name="dateEnd"]');if(dEl&&dEl.value)r.date=dEl.value;let dateEnd=(eEl&&eEl.value)||"";if(dateEnd&&dateEnd<r.date){alert("Tanggal selesai tidak boleh sebelum tanggal mulai.");dateEnd="";if(eEl)eEl.value=""}else if(dateEnd&&dateRangeList(r.date,dateEnd).length>14){alert("Rentang tanggal maksimal 14 hari untuk Daily Report. Untuk periode lebih panjang, gunakan Weekly Report.");dateEnd="";if(eEl)eEl.value=""}r.dateEnd=dateEnd;save();patchSection("weatherSubsection",weatherEditor(r))}
function autosaveDailyDraft(){const form=document.getElementById("dailyForm");if(!form)return;const r=ensureDailyDraft();if(!r)return;const fd=new FormData(form);r.progress=fd.get("progress")||"";r.notes=fd.get("notes")||"";r.kendala=fd.get("kendala")||"";r.followUp=fd.get("followUp")||"";r.documentationMeta=r.documentationMeta||{};r.documentationMeta.workHours=fd.get("workHours")||"";r.documentationMeta.area=fd.get("area")||"";if(fd.get("inputBy"))r.inputBy=fd.get("inputBy");capturePhotoCaptions(photosOf(r));captureMaterialRows(materialsOf(r));captureEquipmentRows(equipmentsOf(r));captureWeatherRows(ensureWeatherSlots(r));r.updatedAt=new Date().toISOString();save()}

function printReportViaIframe(printTitle){

const PDF_SECTION_DEFS=[{key:"progress",label:"Progress Detail"},{key:"notes",label:"Notes"},{key:"kendala",label:"Kendala"},{key:"followUp",label:"Follow-up"},{key:"docMeta",label:"Documentation Metadata"},{key:"materials",label:"Material Masuk Hari Ini"},{key:"equipments",label:"Peralatan Digunakan Hari Ini"}];

// Own extraction routine (kept separate from extractPdfPageLines used by the Daily-Report-PDF-import
// feature) - captures per-line Y and per-item x/y/width/fontSize, which the SPK overlay renderer needs
// and the existing function does not expose. Coordinates are raw PDF user-space (origin bottom-left,
// Y up) - the SAME space pdf-lib's drawText/drawImage/drawRectangle use, so no axis conversion is
// needed between what we detect here and what we draw later.
async function extractSpkPdfStructure(dataUrl){
  const pdfjs=await loadPdfJs();
  const doc=await pdfjs.getDocument({data:dataUrlToBytes(dataUrl)}).promise;
  const pages=[];
  for(let i=1;i<=doc.numPages;i++){
    const page=await doc.getPage(i);
    const viewport=page.getViewport({scale:1});
    const content=await page.getTextContent();
    let lastY=null,cur=[],lines=[];
    const flush=()=>{if(!cur.length)return;const text=cur.map(it=>it.str).join(" ").replace(/\s+/g," ").trim();if(text)lines.push({text,y:lastY,items:cur});cur=[]};
    content.items.forEach(it=>{
      const y=Math.round(it.transform[5]);
      if(lastY!==null&&Math.abs(y-lastY)>2)flush();
      if(it.str.trim()){
        const fontSize=Math.max(6,Math.round(Math.hypot(it.transform[0],it.transform[1]))||9);
        cur.push({str:it.str,x:it.transform[4],y:it.transform[5],w:it.width||0,fontSize});
      }
      lastY=y;
    });
    flush();
    pages.push({width:viewport.width,height:viewport.height,lines});
  }
  return {numPages:doc.numPages,pages};
}

const SPK_BLANK_RE=/(_{3,}|\.{5,}|…{2,})/;
const SPK_LABEL_BLANK_RE=/^(.*?)\s*[:=]\s*(_{3,}|\.{5,}|…{2,})/;
function isHeadingLine(text){const t=text.trim();return t.length>2&&t.length<48&&t===t.toUpperCase()&&/[A-Z]/.test(t)&&!/\d{3,}/.test(t)&&!SPK_BLANK_RE.test(t)}

// Best-effort, pattern-based field detection - NOT true document understanding. It reliably catches
// "Label : ____" / "Label = ____" blanks (which is how this and most SPK-style templates mark fillable
// spots) and flags any other underscore/dot run it finds with a generic auto-name. Every detected field
// is editable/removable/renamable in the review step before the template is saved - this function is an
// accelerator, not an oracle.
function detectSpkFields(structure){
  const fields=[];
  const labelCounts=new Map();
  // Maps an absolute character index within line.text back to the source pdf.js item and the
  // local character offset inside that item's own string - needed because a label and its blank
  // run, or even several separate blanks, can all live inside ONE pdf.js text item with no
  // sub-item boundary (verified against the real uploaded template: e.g. the whole line "Pada
  // hari ini ____, bertempat di ____..." is a single item). Using the item's start position alone
  // for every blank found in it would place all of them at the same wrong spot and can overwrite
  // the label text itself, so every position below is estimated by walking this character map
  // instead of trusting item boundaries to line up with blank boundaries.
  function buildCharMap(line){
    const map=[];
    line.items.forEach((it,idx)=>{
      for(let c=0;c<it.str.length;c++)map.push({item:it,localIdx:c});
      if(idx<line.items.length-1)map.push(null);
    });
    return map;
  }
  function posFor(charMap,absIdx){
    for(let i=absIdx;i<charMap.length;i++)if(charMap[i])return charMap[i];
    for(let i=Math.min(absIdx,charMap.length)-1;i>=0;i--)if(charMap[i])return charMap[i];
    return null;
  }
  function estimateXW(src,runLength){
    const it=src.item;
    const charW=it.w/Math.max(1,it.str.length);
    return {x:it.x+charW*src.localIdx,w:Math.max(40,charW*runLength),y:it.y,fontSize:it.fontSize||9};
  }
  structure.pages.forEach((page,pIdx)=>{
    let section="";
    page.lines.forEach(line=>{
      if(isHeadingLine(line.text)){section=line.text.trim();return}
      const charMap=buildCharMap(line);
      const m=SPK_LABEL_BLANK_RE.exec(line.text);
      if(m){
        let label=m[1].replace(/^[^\p{L}\p{N}]+/u,"").trim();
        const blankStartAbs=line.text.indexOf(m[2],m[1].length);
        const src=label&&blankStartAbs>=0?posFor(charMap,blankStartAbs):null;
        if(src){
          const key=label.toLowerCase();
          const n=(labelCounts.get(key)||0)+1;labelCounts.set(key,n);
          const displayLabel=n>1&&section?`${label} (${section})`:label;
          const geo=estimateXW(src,m[2].length);
          fields.push({id:uid("spkf"),label:displayLabel,page:pIdx+1,x:geo.x,y:geo.y,width:geo.w,fontSize:geo.fontSize,type:"text",required:true,source:"auto"});
        }
      }else{
        const re=new RegExp(SPK_BLANK_RE.source,"g");
        let bm;
        while((bm=re.exec(line.text))){
          const src=posFor(charMap,bm.index);
          if(!src)continue;
          // Strip any earlier blank run(s) out of the preceding context first (a line can have
          // more than one blank, e.g. "hari ___, bertempat di ___" - without this, the label for
          // the second blank would drag the first blank's underscores into its own text).
          const before=line.text.slice(0,bm.index).replace(new RegExp(SPK_BLANK_RE.source,"g")," ");
          const words=before.trim().split(/\s+/).slice(-4).join(" ");
          const geo=estimateXW(src,bm[0].length);
          // Extra-conservative width for this case specifically: the position/width here comes
          // from an averaged per-character estimate across a whole merged multi-word PDF text run
          // (verified against the real template - a full sentence can be one single text item with
          // no boundary between prose and blank), which is far less precise than the isolated
          // "Label : ____" pattern above. Shrinking the usable width leaves a buffer so a filled
          // value truncates a little earlier rather than risk eating into the neighbouring word.
          fields.push({id:uid("spkf"),label:`Isian: "${trim(words||line.text,40)}"`,page:pIdx+1,x:geo.x,y:geo.y,width:geo.w*0.65,fontSize:geo.fontSize,type:"text",required:false,source:"auto"});
        }
      }
    });
  });
  return fields;
}

async function renderSpkPageToImage(dataUrl,pageNum){
  const pdfjs=await loadPdfJs();
  const doc=await pdfjs.getDocument({data:dataUrlToBytes(dataUrl)}).promise;
  const page=await doc.getPage(pageNum);
  const base=page.getViewport({scale:1}),scale=Math.min(2.2,1200/base.width),viewport=page.getViewport({scale});
  const canvas=document.createElement("canvas");
  canvas.width=Math.ceil(viewport.width);canvas.height=Math.ceil(viewport.height);
  const ctx=canvas.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,canvas.width,canvas.height);
  await page.render({canvasContext:ctx,viewport}).promise;
  return {dataUrl:canvas.toDataURL("image/jpeg",.92),widthPx:canvas.width,heightPx:canvas.height,scale};
}

  inputEl.value="";
  if(!file)return;
  if(!getProjectById(activeProjectId)){/* templates are project-agnostic; no requirement here */}
  const nameGuess=file.name.replace(/\.pdf$/i,"");
  spkAnalyzeBusy=true;render();
  try{
    const pdfDataUrl=await fileToData(file);
    const structure=await extractSpkPdfStructure(pdfDataUrl);
    const fields=detectSpkFields(structure);
    const headerLines=(structure.pages[0]?.lines||[]).filter(l=>l.y>structure.pages[0].height-120);
    const letterhead={
      companyName:headerLines.find(l=>l.text.length>4&&l.text===l.text.toUpperCase())?.text||"",
      tagline:"",phone:"",email:""
    };
    const tmpl={...blankSpkTemplate(),id:uid("spktmpl"),name:nameGuess,fileName:file.name,pdfDataUrl,numPages:structure.numPages,pageSizes:structure.pages.map(p=>({w:p.width,h:p.height})),letterhead,fields,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};
    db.spkTemplates.push(tmpl);
    editingSpkTemplateId=tmpl.id;
    spkAnalyzeBusy=false;
    route="spkTemplate";
    save();render();
  }catch(e){
    spkAnalyzeBusy=false;
    console.warn("Gagal menganalisis template SPK",e);
    alert("Gagal menganalisis PDF template. Pastikan file adalah PDF yang valid dan koneksi internet aktif (dibutuhkan sekali untuk memuat PDF.js). Detail: "+e.message);
    render();
  }
}
function updateSpkFieldMeta(tmplId,fieldId,patch){const t=getSpkTemplateById(tmplId);if(!t)return;const f=spkFieldById(t,fieldId);if(!f)return;Object.assign(f,patch);t.updatedAt=new Date().toISOString();save()}
function removeSpkField(tmplId,fieldId){const t=getSpkTemplateById(tmplId);if(!t)return;t.fields=t.fields.filter(f=>f.id!==fieldId);t.updatedAt=new Date().toISOString();save();render()}
function renameSpkTemplate(tmplId,name){const t=getSpkTemplateById(tmplId);if(!t)return;t.name=name;save()}
function deleteSpkTemplate(tmplId){if(!confirm("Hapus template SPK ini? Dokumen yang sudah dibuat dari template ini tidak akan ikut terhapus tapi tidak bisa digenerate ulang."))return;db.spkTemplates=db.spkTemplates.filter(t=>t.id!==tmplId);if(editingSpkTemplateId===tmplId)editingSpkTemplateId="";save();route="spk";render()}

/* ---------- Manual field placement (click-to-place on rendered page) ---------- */
async function startSpkManualFieldPick(tmplId,pageNum){
  const t=getSpkTemplateById(tmplId);if(!t)return;
  spkFieldPickPending=true;render();
  try{
    const rendered=await renderSpkPageToImage(t.pdfDataUrl,pageNum);
    const el=document.getElementById("spkPagePicker");
    if(!el)return;
    el.innerHTML=`<img src="${rendered.dataUrl}" style="width:100%;display:block;cursor:crosshair" id="spkPickImg">`;
    const img=document.getElementById("spkPickImg");
    img.onclick=(e)=>{
      const rect=img.getBoundingClientRect();
      const pxRatioX=rendered.widthPx/rect.width, pxRatioY=rendered.heightPx/rect.height;
      const clickXpx=(e.clientX-rect.left)*pxRatioX, clickYpx=(e.clientY-rect.top)*pxRatioY;
      const pdfX=clickXpx/rendered.scale;
      const pdfY=t.pageSizes[pageNum-1].h-(clickYpx/rendered.scale);
      const label=prompt("Nama field untuk posisi ini:","Field baru");
      if(label){
        t.fields.push({id:uid("spkf"),label,page:pageNum,x:pdfX,y:pdfY,width:150,fontSize:9,type:"text",required:false,source:"manual"});
        t.updatedAt=new Date().toISOString();save();
      }
      spkFieldPickPending=false;render();
    };
  }catch(e){spkFieldPickPending=false;alert("Gagal menampilkan halaman: "+e.message);render()}
}


/* ---------- Document creation / data entry ---------- */
function ensureSpkDocument(templateId){
  if(editingSpkDocId){const existing=getSpkDocumentById(editingSpkDocId);if(existing)return existing}
  const t=getSpkTemplateById(templateId);if(!t)return null;
  const doc={...blankSpkDocument(),id:uid("spkdoc"),templateId,projectId:activeProjectId||"",createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};
  db.spkDocuments.push(doc);
  editingSpkDocId=doc.id;
  save();
  return doc;
}
function deleteSpkDocument(id){if(!confirm("Hapus SPK ini?"))return;db.spkDocuments=db.spkDocuments.filter(x=>x.id!==id);if(editingSpkDocId===id)editingSpkDocId="";save();route="spk";render()}
function captureLiveSpkFields(doc){const t=getSpkTemplateById(doc.templateId);if(!t)return;t.fields.forEach(f=>{const el=document.querySelector(`[data-spk-field="${f.id}"]`);if(!el)return;if(f.type==="list"){const items=$$(`[data-spk-list="${f.id}"] input`).map(i=>i.value.trim()).filter(Boolean);doc.values[f.id]=items}else{doc.values[f.id]=el.value}})}
function saveSpkDocFields(){const doc=getSpkDocumentById(editingSpkDocId);if(!doc)return;captureLiveSpkFields(doc);doc.updatedAt=new Date().toISOString();save();render()}
function addSpkListItem(fieldId){const doc=getSpkDocumentById(editingSpkDocId);if(!doc)return;captureLiveSpkFields(doc);const list=Array.isArray(doc.values[fieldId])?doc.values[fieldId]:[];doc.values[fieldId]=[...list,""];save();render()}
function removeSpkListItem(fieldId,idx){const doc=getSpkDocumentById(editingSpkDocId);if(!doc)return;captureLiveSpkFields(doc);const list=Array.isArray(doc.values[fieldId])?doc.values[fieldId]:[];list.splice(idx,1);doc.values[fieldId]=list;save();render()}

/* ---------- KTP upload + OCR (Tesseract.js, lazy-loaded; result always requires manual verification) ---------- */
async function handleSpkKtpUpload(inputEl){
  const file=(inputEl.files||[])[0];inputEl.value="";if(!file)return;
  const doc=getSpkDocumentById(editingSpkDocId);if(!doc)return;
  captureLiveSpkFields(doc);
  doc.ktp.imageDataUrl=await fileToData(file);
  doc.ktp.ocrRawText="";doc.ktp.extracted=null;doc.ktp.verified=false;
  save();render();
}
function parseKtpOcrText(text){
  const grab=(re)=>{const m=re.exec(text);return m?m[1].trim().replace(/[|_]+$/,"").trim():""};
  return{
    nik:grab(/NIK\s*[:\-]?\s*([0-9 ]{10,20})/i).replace(/\s+/g,""),
    nama:grab(/Nama\s*[:\-]?\s*([A-Za-z'.\s]{2,60})/i),
    ttl:grab(/Tempat\/?Tgl\s*Lahir\s*[:\-]?\s*([^\n]{4,60})/i),
    alamat:grab(/Alamat\s*[:\-]?\s*([^\n]{4,80})/i)
  };
}
async function runSpkKtpOcr(){
  const doc=getSpkDocumentById(editingSpkDocId);if(!doc||!doc.ktp.imageDataUrl)return;
  doc.ktp.ocrBusy=true;render();
  try{
    const Tesseract=await loadTesseractSpk();
    const result=await Tesseract.recognize(doc.ktp.imageDataUrl,"ind+eng");
    const text=result?.data?.text||"";
    doc.ktp.ocrRawText=text;
    doc.ktp.extracted=parseKtpOcrText(text);
    doc.ktp.verified=false;
  }catch(e){
    console.warn("OCR KTP gagal",e);
    alert("OCR gagal dijalankan (perlu koneksi internet saat pertama kali dipakai). Anda tetap bisa mengisi data KTP secara manual. Detail: "+e.message);
  }
  doc.ktp.ocrBusy=false;save();render();
}
function updateSpkKtpExtracted(field,value){const doc=getSpkDocumentById(editingSpkDocId);if(!doc||!doc.ktp.extracted)return;doc.ktp.extracted[field]=value;doc.ktp.verified=false;save()}
function confirmSpkKtpVerified(){const doc=getSpkDocumentById(editingSpkDocId);if(!doc||!doc.ktp.extracted)return;doc.ktp.verified=true;
  // Try to auto-fill matching document fields by fuzzy label match, but only after explicit user confirmation.
  const t=getSpkTemplateById(doc.templateId);
  if(t){
    const map=[["nik","ktp"],["nama","nama"],["alamat","alamat"],["ttl","lahir"]];
    map.forEach(([srcKey,labelHint])=>{
      const val=doc.ktp.extracted[srcKey];
      if(!val)return;
      const f=t.fields.find(f=>f.label.toLowerCase().includes(labelHint)&&!doc.values[f.id]);
      if(f)doc.values[f.id]=val;
    });
  }
  save();render();
}
function removeSpkKtp(){const doc=getSpkDocumentById(editingSpkDocId);if(!doc)return;if(!confirm("Hapus foto KTP dari draft ini?"))return;doc.ktp={imageDataUrl:"",ocrRawText:"",ocrBusy:false,extracted:null,verified:false};save();render()}

/* ---------- Validation ---------- */
function validateSpkDocument(doc,tmpl){
  const errors=[];
  captureLiveSpkFields(doc);
  tmpl.fields.forEach(f=>{
    const v=doc.values[f.id];
    const empty=f.type==="list"?!(Array.isArray(v)&&v.length):!String(v||"").trim();
    if(f.required&&empty)errors.push(`"${f.label}" wajib diisi.`);
    if(!empty&&f.type==="number"&&isNaN(Number(String(v).replace(/[.,]/g,"")))) errors.push(`"${f.label}" harus berupa angka.`);
    if(!empty&&f.type==="date"&&isNaN(Date.parse(v)))errors.push(`"${f.label}" tanggal tidak valid.`);
  });
  if(doc.ktp.imageDataUrl&&doc.ktp.extracted&&!doc.ktp.verified)errors.push("Data hasil OCR KTP belum diverifikasi - periksa dan konfirmasi dulu di bagian Pihak Kedua / KTP.");
  return errors;
}

/* ---------- Final PDF generation (overlay on the original uploaded template - preserves layout) ---------- */
async function generateSpkPdfBytes(doc,tmpl){
  const PDFLib=await loadPdfLibSpk();
  const srcBytes=dataUrlToBytes(tmpl.pdfDataUrl);
  const pdfDoc=await PDFLib.PDFDocument.load(srcBytes);
  const font=await pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);
  const pages=pdfDoc.getPages();
  tmpl.fields.forEach(f=>{
    const val=doc.values[f.id];
    const empty=f.type==="list"?!(Array.isArray(val)&&val.length):!String(val||"").trim();
    if(empty)return;
    const pageObj=pages[f.page-1];if(!pageObj)return;
    const size=f.fontSize||9;
    const rawLines=f.type==="list"?val.map(v=>`•  ${v}`):String(val).split("\n");
    // Detected field widths are only an estimate of the ORIGINAL blank's space (see
    // detectSpkFields) - drawing text wider than that would bleed into whatever text sits next
    // to the blank on the same line (verified against the real template: long values otherwise
    // overwrote neighbouring words like "bertempat"/"telah"). Use pdf-lib's real font metrics to
    // trim each line to what actually fits, and size the whiteout box to the real measured width
    // of the (now-fitted) text rather than a fixed guess, so it's never too narrow (leaving a
    // sliver of the original blank visible) nor too wide (covering neighbouring text).
    const availW=Math.max(f.width,60);
    const fitLine=(s)=>{let t=String(s);while(t.length>1&&font.widthOfTextAtSize(t,size)>availW)t=t.slice(0,-1);return t};
    const lines=rawLines.map(fitLine);
    const boxW=Math.max(availW,20,...lines.map(l=>font.widthOfTextAtSize(l,size)))+6;
    pageObj.drawRectangle({x:f.x-2,y:f.y-2,width:boxW,height:(size+3)*lines.length+4,color:PDFLib.rgb(1,1,1),opacity:1});
    lines.forEach((ln,i)=>{
      pageObj.drawText(ln,{x:f.x,y:f.y-i*(size+3),size,font,color:PDFLib.rgb(0.07,0.07,0.07)});
    });
  });
  return pdfDoc.save();
}
async function exportSpkPdf(){
  const doc=getSpkDocumentById(editingSpkDocId);
  const tmpl=doc&&getSpkTemplateById(doc.templateId);
  if(!doc||!tmpl)return;
  const errors=validateSpkDocument(doc,tmpl);
  if(errors.length){alert("Belum bisa generate PDF:\n\n- "+errors.join("\n- "));render();return}
  try{
    const bytes=await generateSpkPdfBytes(doc,tmpl);
    const dataUrl=bytesToDataUrl(bytes,"application/pdf");
    doc.generatedPdfDataUrl=dataUrl;doc.status="final";doc.updatedAt=new Date().toISOString();
    save();
    const blob=new Blob([bytes],{type:"application/pdf"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download=`SPK - ${cleanFile(tmpl.name)} - ${(doc.values[tmpl.fields.find(f=>/nomor/i.test(f.label))?.id]||doc.id)}.pdf`.replace(/\s+/g," ");
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    route="spkPreview";previewSpkDocId=doc.id;render();
  }catch(e){
    console.warn("Gagal generate PDF SPK",e);
    alert("Gagal membuat PDF akhir. Detail: "+e.message);
  }
}

/* ---------- Live preview overlay (renders pages + positions filled text on top, for on-screen checking only) ---------- */
async function renderSpkLivePreview(){
  const doc=getSpkDocumentById(editingSpkDocId);
  const tmpl=doc&&getSpkTemplateById(doc.templateId);
  const wrap=document.getElementById("spkPreviewArea");
  if(!doc||!tmpl||!wrap)return;
  captureLiveSpkFields(doc);
  wrap.innerHTML=`<p class="muted">Merender preview...</p>`;
  try{
    let html="";
    for(let pn=1;pn<=tmpl.numPages;pn++){
      const rendered=await renderSpkPageToImage(tmpl.pdfDataUrl,pn);
      const scalePx=rendered.widthPx/tmpl.pageSizes[pn-1].w;
      let overlays="";
      tmpl.fields.filter(f=>f.page===pn).forEach(f=>{
        const val=doc.values[f.id];
        const empty=f.type==="list"?!(Array.isArray(val)&&val.length):!String(val||"").trim();
        if(empty)return;
        const lines=f.type==="list"?val.map(v=>`•  ${v}`):String(val).split("\n");
        const leftPx=f.x*scalePx,topPx=(tmpl.pageSizes[pn-1].h-f.y)*scalePx;
        // Cap the preview box to the field's estimated available width, same as the final PDF
        // generator does with real font metrics - keeps what's shown here honest about what will
        // actually fit instead of implying more room than the template blank really has.
        const widthPx=Math.max(20,f.width*scalePx);
        overlays+=`<div style="position:absolute;left:${leftPx}px;top:${topPx-2}px;max-width:${widthPx}px;font-size:${f.fontSize*scalePx}px;line-height:1.25;color:#111;background:#fff;padding:0 1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${lines.map(esc).join("<br>")}</div>`;
      });
      html+=`<div class="spk-page-wrap"><img src="${rendered.dataUrl}" style="width:100%;display:block"><div class="spk-overlay-layer">${overlays}</div></div>`;
    }
    wrap.innerHTML=html;
  }catch(e){wrap.innerHTML=`<p class="muted">Gagal merender preview: ${esc(e.message)}</p>`}
}

function spkFieldInputHtml(doc,f){
  const val=doc.values[f.id];
  if(f.type==="list"){
    const items=Array.isArray(val)?val:[];
    return `<div class="field full"><label>${esc(f.label)}${f.required?" *":""}</label><div data-spk-list="${f.id}">${items.map((it,i)=>`<div class="item-row" style="grid-template-columns:1fr auto"><input class="input small" value="${esc(it)}"><button class="btn small warn" type="button" onclick="removeSpkListItem('${f.id}',${i})">Hapus</button></div>`).join("")||`<p class="muted">Belum ada item.</p>`}</div><button class="btn small" type="button" onclick="addSpkListItem('${f.id}')">+ Tambah Item</button></div>`;
  }
  if(f.type==="textarea")return `<div class="field full"><label>${esc(f.label)}${f.required?" *":""}</label><textarea class="textarea" data-spk-field="${f.id}">${esc(val||"")}</textarea></div>`;
  const type=f.type==="date"?"date":f.type==="number"?"number":"text";
  return `<div class="field"><label>${esc(f.label)}${f.required?" *":""}</label><input class="input" type="${type}" data-spk-field="${f.id}" value="${esc(val||"")}"></div>`;
}

  <div class="grid"><div class="card pad span7"><h2 style="margin-top:0">Data SPK</h2><div class="form">${sortedFields.map(f=>spkFieldInputHtml(doc,f)).join("")||`<p class="muted">Template ini tidak punya field. Tambahkan field manual dulu dari halaman Kelola Template.</p>`}</div>
  <div class="subsection"><div class="subhead"><label>Pihak Kedua / KTP (opsional)</label></div>
  ${ktp.imageDataUrl?`<div class="sig-preview" style="height:140px"><img src="${ktp.imageDataUrl}"></div><div class="sig-actions"><button class="btn small" onclick="runSpkKtpOcr()" ${ktp.ocrBusy?"disabled":""}>${ktp.ocrBusy?"Membaca KTP...":"Jalankan OCR"}</button><button class="btn small warn" onclick="removeSpkKtp()">Hapus Foto</button></div>`:`<label class="btn small">Upload Foto KTP<input class="inline-file" type="file" accept="image/*" onchange="handleSpkKtpUpload(this)"></label>`}
  ${ktp.extracted?`<div class="item-table" style="margin-top:8px"><p class="muted">Hasil OCR - periksa dan perbaiki dulu sebelum dipakai:</p>${["nama","nik","alamat","ttl"].map(k=>`<div class="field"><label>${k.toUpperCase()}</label><input class="input" value="${esc(ktp.extracted[k]||"")}" onchange="updateSpkKtpExtracted('${k}',this.value)"></div>`).join("")}${ktp.verified?`<p class="chip ok">Sudah diverifikasi</p>`:`<button class="btn small primary" onclick="confirmSpkKtpVerified()">Konfirmasi Data Benar &amp; Terapkan ke Form</button>`}</div>`:""}
  </div></div>
  <div class="card pad span5"><h2 style="margin-top:0">Preview</h2><button class="btn small" onclick="renderSpkLivePreview()">Refresh Preview</button><div id="spkPreviewArea" style="margin-top:8px"><p class="muted">Klik "Refresh Preview" untuk melihat hasil sementara.</p></div></div></div></section>`;
}

function viewSpkPreview(){
  const doc=getSpkDocumentById(previewSpkDocId);
  if(!doc||!doc.generatedPdfDataUrl)return `<section><div class="empty"><h3>PDF belum digenerate</h3><button class="btn" data-go="spk">Kembali</button></div></section>`;
  const t=getSpkTemplateById(doc.templateId);
  return `<section><div class="toolbar no-print"><div class="title"><h1>SPK Selesai Dibuat</h1><p>${esc(t?.name||"")}</p></div><div class="actions"><button class="btn" onclick="editingSpkDocId='${doc.id}';route='spkDoc';render()">Edit Lagi</button><a class="btn primary" href="${doc.generatedPdfDataUrl}" download="SPK.pdf">Download PDF</a></div></div><embed src="${doc.generatedPdfDataUrl}" type="application/pdf" style="width:100%;height:85vh;border:1px solid var(--border);border-radius:14px"></section>`;
}

load().then(render);
</script>
</body>
</html>
